# Firebase App Hosting config for the cyclenetworkgrow-next review backend.
# See docs/DEPLOY.md. Client-side NEXT_PUBLIC_* config comes from the
# committed .env.production (Next.js loads it directly during the build) —
# nothing secret needs to live here except what's explicitly a `secret:`
# reference below (Secret Manager, not a plaintext value).

env:
  # Created via `firebase apphosting:secrets:set` + `:grantaccess` — see
  # docs/DEPLOY.md's Strava section.
  - variable: STRAVA_CLIENT_SECRET
    secret: STRAVA_CLIENT_SECRET
    availability:
      - RUNTIME
  # RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
  # deliberately not bound here yet — src/lib/razorpay.ts and
  # /api/webhooks/razorpay exist but nothing calls them (registration sync
  # went with the Google Sheets route instead; see docs/DEPLOY.md). Add
  # these back (with real secrets created first) if that work resumes.
  #
  # GOOGLE_SHEETS_CREDENTIALS_JSON is temporarily unbound too — the build
  # fails outright if a referenced secret doesn't exist yet in Secret
  # Manager, and this one hasn't been created there yet (see docs/DEPLOY.md's
  # Google Sheets section for the exact `secrets:set` + `:grantaccess`
  # commands). Registration sync (RegistrationSyncPanel /
  # /api/admin/legacy-events/.../sync-registrations) will 500 until this is
  # re-added — rebind it once the secret exists.
  # - variable: GOOGLE_SHEETS_CREDENTIALS_JSON
  #   secret: GOOGLE_SHEETS_CREDENTIALS_JSON
  #   availability:
  #     - RUNTIME

runConfig:
  # Review site, low traffic — keep it cheap. Bump if it needs to hold more
  # than one concurrent request comfortably (the old Cloud Functions deploy
  # OOM'd at its 256MiB default; give this more headroom from the start).
  minInstances: 0
  maxInstances: 2
  memoryMiB: 512
  cpu: 1
