name: Deploy review site

# Deploys cyclenetworkgrow-next.web.app (a NON-production review site on the
# shared challenge1177 Firebase project). See docs/DEPLOY.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-review-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: review
      url: https://cyclenetworkgrow-next.web.app
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_KEY }}

      - name: Deploy to Firebase Hosting
        run: >
          npx --yes firebase-tools@15 deploy
          --only hosting
          --project challenge1177
          --force
          --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          # Enables the Next.js web-frameworks build (normally a local-only opt-in).
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          # Forces `next build` onto webpack — Turbopack's module externalization
          # breaks firebase-admin at runtime. See docs/DEPLOY.md.
          IS_WEBPACK_TEST: "1"
